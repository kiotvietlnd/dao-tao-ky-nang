<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kịch bản CSKH Chủ động & Gia tăng giá trị - KiotViet</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#1e3a8a',
                            orange: '#f97316',
                            sky: '#e0f2fe',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { font-family: 'Inter', sans-serif !important; }

        body {
            margin: 0;
            background: #f1f5f9;
        }

        .slide-frame {
            width: 1280px;
            height: 720px;
            position: relative;
            overflow: hidden;
            background: #ffffff;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
            border-radius: 1.25rem;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        .title-slide-content {
            background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%) !important;
            color: white !important;
        }

        .logo-container {
            position: absolute;
            top: 30px;
            right: 40px;
            z-index: 50;
        }
        .logo-img { height: 38px; width: auto; }
        .logo-invert { filter: brightness(0) invert(1); }
        
        .table-wrap { overflow: hidden; border-radius: 0.75rem; border: 1px solid #cbd5e1; }

        /* PRINT STYLES CHO PHÉP IN TẤT CẢ SLIDE */
        @media print {
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            #print-container {
                display: block !important;
            }
            #interactive-container {
                display: none !important;
            }
            .slide-page {
                page-break-after: always;
                break-after: page;
                width: 1280px !important;
                height: 720px !important;
                margin: 0 auto;
                box-shadow: none !important;
                border-radius: 0 !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        @page {
            size: 1280px 720px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const Icon = ({ name, size = 22, className = "" }) => {
            const spanRef = React.useRef(null);
            React.useEffect(() => {
                if (spanRef.current) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    lucide.createIcons({ root: spanRef.current, attrs: { width: size, height: size } });
                }
            }, [name, size, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
        };

        const Logo = ({ isTitle }) => (
            <div className="logo-container">
                <img 
                    src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal.svg" 
                    alt="KiotViet Logo" 
                    className={`logo-img ${isTitle ? 'logo-invert' : ''}`}
                    referrerPolicy="no-referrer"
                />
            </div>
        );

        const Slide = ({ children, className = "", isTitle = false }) => (
            <div className={`slide-frame ${isTitle ? 'title-slide-content' : ''} ${className}`}>
                <Logo isTitle={isTitle} />
                <div className="relative z-10 flex flex-col h-full w-full">
                    {children}
                </div>
            </div>
        );

        const SlideTitle = ({ children }) => (
            <h2 className="text-3xl font-extrabold mb-5 text-brand-blue uppercase border-l-8 border-brand-orange pl-4 tracking-tight shrink-0 whitespace-nowrap">
                {children}
            </h2>
        );

        const getSlides = () => {
            const checkListItems = [
                "Nêu lý do tiếp cận liên quan đến tình hình thực tế của khách hàng dựa trên MP (và quan sát)",
                "Xử lý được từ chối khi tiếp cận",
                "Thực hiện xác thực nhanh gọn rõ ràng đầy đủ",
                "Đặt các câu hỏi để khéo léo khai thác được tình trạng thực tế",
                "Xác nhận đúng vấn đề/ tình trạng & đưa ra hướng xử lý phù hợp",
                "Lựa chọn, gợi mở tính năng phù hợp tình trạng và đặc thù cửa hàng",
                "Làm rõ được giá trị lợi ích tính năng mang lại đối với khách hàng",
                "Khảo sát nhu cầu hỗ trợ thêm và xử lý vấn đề nếu có",
                "Xác nhận hỗ trợ xong và chào kết thúc đúng quy trình."
            ];

            return [
                // Slide 0: Title
                <Slide key="title" isTitle={true}>
                    <div className="flex flex-col justify-center items-center h-full text-center">
                        <h1 className="font-black uppercase mb-6 text-white text-[44px] leading-tight">
                            KỊCH BẢN CHĂM SÓC KHÁCH HÀNG CHỦ ĐỘNG<br/>
                            <span className="text-brand-orange">& GIA TĂNG GIÁ TRỊ PHẦN MỀM</span>
                        </h1>
                        <p className="text-2xl text-blue-100 mb-8 font-medium">Dành cho nhân viên DVKH SC</p>
                        <div className="bg-gradient-to-r from-brand-orange to-orange-500 text-white px-8 py-3 rounded-full font-bold text-lg flex items-center gap-3">
                            <Icon name="graduation-cap" /> Learning & Development Department
                        </div>
                    </div>
                </Slide>,

                // Slide 1: Mục tiêu đào tạo
                <Slide key="1">
                    <SlideTitle>Mục tiêu đào tạo</SlideTitle>
                    <div className="grid grid-cols-12 gap-8 flex-grow items-center pb-4">
                        <div className="col-span-8 space-y-3">
                            <p className="text-[20px] font-bold text-brand-blue mb-4">Khóa học giúp nhân viên SC thực hiện trọn vẹn buổi chăm sóc khách hàng T15 theo quy trình:</p>
                            {[
                                "Phân tích và sử dụng dữ liệu MP để chuẩn bị cho buổi gặp và tiếp cận hiệu quả",
                                "Xác minh và nhận diện tình trạng thực tế của khách hàng",
                                "Thực hiện hướng chăm sóc phù hợp để gia tăng giá trị cho khách hàng",
                                "Thăm dò nhu cầu hỗ trợ thêm và hoàn tất chăm sóc"
                            ].map((text, idx) => (
                                <div key={idx} className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 flex gap-4 items-center">
                                    <Icon name="check-circle-2" className="text-brand-orange" size={28} />
                                    <span className="text-slate-800 text-[18px] font-medium">{text}</span>
                                </div>
                            ))}
                        </div>
                        <div className="col-span-4 flex justify-center items-center">
                            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmP9AOMR7BfF9WRb7cgusQxtyOsEkWbl8hVsohtbKDgw&s=10" alt="Training" className="w-full h-[360px] object-cover rounded-2xl border-2 border-slate-200 shadow-sm" />
                        </div>
                    </div>
                </Slide>,

                // Slide 2: Nguyên tắc tham gia
                <Slide key="2">
                    <SlideTitle>Nguyên tắc tham gia</SlideTitle>
                    <div className="grid grid-cols-3 gap-6 flex-grow items-center pb-6">
                        {[
                            { icon: "unlock", title: "Cởi mở", desc: "Không có câu trả lời đúng hay sai, chỉ có cách giải quyết phù hợp trong từng tình huống." },
                            { icon: "hand-metal", title: "Chủ động", desc: "Tham gia chia sẻ, đặt câu hỏi & thực hành để nhận được phản hồi giúp hoàn thiện kỹ năng." },
                            { icon: "heart-handshake", title: "Tích cực", desc: "Xây dựng môi trường học tập an toàn, lắng nghe và tôn trọng ý kiến khác biệt." }
                        ].map((item, i) => (
                            <div key={i} className="bg-slate-50 border border-slate-200 rounded-2xl p-6 text-center h-[340px] flex flex-col justify-center items-center shadow-sm">
                                <div className="w-20 h-20 bg-orange-100 rounded-full flex items-center justify-center text-brand-orange mb-4">
                                    <Icon name={item.icon} size={40} />
                                </div>
                                <h3 className="text-[24px] font-bold text-brand-blue mb-2">{item.title}</h3>
                                <p className="text-[17px] text-slate-600 leading-relaxed">{item.desc}</p>
                            </div>
                        ))}
                    </div>
                </Slide>,

                // Slide 3: Cách thức học
                <Slide key="3">
                    <SlideTitle>Cách thức học</SlideTitle>
                    <div className="grid grid-cols-2 gap-6 flex-grow items-center pb-6">
                        {[
                            { icon: "tv", text: "Tiếp nhận hướng dẫn từ giảng viên & Đặt câu hỏi làm rõ vướng mắc nếu có" },
                            { icon: "edit-3", text: "Thực hiện các nhiệm vụ cá nhân theo yêu cầu, kết hợp sử dụng tài liệu in" },
                            { icon: "users", text: "Thảo luận & Thực hành đóng vai mô phỏng buổi gặp khách hàng theo cặp/nhóm" },
                            { icon: "eye", text: "Quan sát & Phản hồi lẫn nhau trong quá trình thực hành" }
                        ].map((item, i) => (
                            <div key={i} className="bg-slate-50 p-6 rounded-2xl border border-slate-200 flex items-center gap-5 h-[150px]">
                                <div className="bg-blue-100 text-brand-blue w-14 h-14 rounded-full flex items-center justify-center shrink-0">
                                    <Icon name={item.icon} size={30} />
                                </div>
                                <span className="font-medium text-[19px] text-slate-700">{item.text}</span>
                            </div>
                        ))}
                    </div>
                </Slide>,

                // Slide 4: Hoạt động 1
                <Slide key="4">
                    <SlideTitle>Hoạt động 1 (15 phút)</SlideTitle>
                    <div className="flex flex-col flex-grow justify-center pb-6">
                        <div className="bg-slate-50 p-8 rounded-2xl border border-slate-200 text-center max-w-4xl mx-auto w-full">
                            <h3 className="text-[22px] font-bold text-brand-blue mb-6">Giới thiệu làm quen với nhóm và cùng trả lời các câu hỏi dưới đây:</h3>
                            <div className="space-y-4 mb-6 text-left">
                                <div className="bg-white p-4 rounded-xl border border-slate-200 flex gap-4 items-center">
                                    <span className="bg-brand-blue text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">1</span>
                                    <span className="text-[18px] text-slate-800">Trong cuộc gặp CSKH trực tiếp, bạn thường làm những nhiệm vụ gì?</span>
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 flex gap-4 items-center">
                                    <span className="bg-brand-orange text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">2</span>
                                    <span className="text-[18px] text-slate-800">Quá trình CSKH trực tiếp thường gặp phải những khó khăn/rào cản nào từ phía khách hàng?</span>
                                </div>
                                <div className="bg-white p-4 rounded-xl border border-slate-200 flex gap-4 items-center">
                                    <span className="bg-green-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold">3</span>
                                    <span className="text-[18px] text-slate-800">Đối với bạn, như thế nào là một cuộc gặp CSKH trực tiếp thành công?</span>
                                </div>
                            </div>
                            <p className="text-[18px] font-bold text-brand-orange flex items-center justify-center gap-2">
                                <Icon name="users" /> Tổng kết lại các ý và cử đại diện chia sẻ
                            </p>
                        </div>
                    </div>
                </Slide>,

                // Slide 5: Mục tiêu cuộc gọi CSKH
                <Slide key="5">
                    <SlideTitle>Mục tiêu cuộc gọi chăm sóc khách hàng chủ động</SlideTitle>
                    <div className="flex flex-col flex-grow justify-center gap-5 pb-6">
                        <div className="bg-blue-50 p-5 rounded-xl border-l-4 border-brand-blue">
                            <p className="text-[20px] text-slate-800">Sau <strong className="text-brand-blue font-bold">15 ngày (T15)</strong> hoàn tất hợp đồng đăng ký phần mềm KiotViet, nhân viên SC thực hiện cuộc gọi/gặp chăm sóc khách hàng chủ động.</p>
                        </div>
                        <div className="bg-slate-50 p-5 rounded-xl border border-slate-200">
                            <p className="text-[20px] text-slate-800">Khách hàng vừa mới sử dụng có thể cần hỗ trợ hướng dẫn và chăm sóc thêm để hiểu các giá trị của phần mềm, thấy việc dùng phần mềm là <strong className="text-brand-orange font-bold">cần thiết, hiệu quả và dễ dàng</strong>.</p>
                        </div>
                        <div className="bg-gradient-to-r from-brand-orange to-orange-500 text-white p-6 rounded-xl flex items-center gap-5">
                            <Icon name="target" size={38} />
                            <div>
                                <h4 className="text-[22px] font-bold">Mục tiêu cốt lõi:</h4>
                                <p className="text-[20px]">Chăm sóc và gợi mở các giá trị để khách hàng thấy được những lợi ích từ phần mềm và duy trì sử dụng.</p>
                            </div>
                        </div>
                    </div>
                </Slide>,

                // Slide 6: Biểu hiện cuộc gọi tạo giá trị
                <Slide key="6">
                    <SlideTitle>Biểu hiện cuộc gọi/gặp CSKH chủ động tạo được giá trị</SlideTitle>
                    <div className="flex flex-col flex-grow justify-center gap-5 pb-6 max-w-4xl mx-auto w-full">
                        {[
                            { num: "1", text: "Khách hàng thao tác được cơ bản trên phần mềm mà không gặp lỗi hay trở ngại.", color: "border-brand-blue text-brand-blue bg-blue-50" },
                            { num: "2", text: "Khách hàng sẵn sàng áp dụng thêm những tính năng/ dịch vụ Add-on phù hợp mang lại giá trị lợi ích phù hợp với hoạt động kinh doanh thực tế.", color: "border-brand-orange text-brand-orange bg-orange-50" },
                            { num: "3", text: "Khách hàng sẵn sàng áp dụng và duy trì sử dụng các tính năng phù hợp trong hoạt động kinh doanh thực tế.", color: "border-green-600 text-green-600 bg-green-50" }
                        ].map((b, i) => (
                            <div key={i} className={`p-5 rounded-2xl border-l-8 bg-white shadow-sm border border-slate-200 flex items-center gap-5 ${b.color.split(' ')[0]}`}>
                                <div className={`w-12 h-12 rounded-full flex items-center justify-center font-black text-xl shrink-0 ${b.color.split(' ')[2]} ${b.color.split(' ')[1]}`}>
                                    {b.num}
                                </div>
                                <p className="text-[19px] text-slate-800 font-medium">{b.text}</p>
                            </div>
                        ))}
                    </div>
                </Slide>,

                // Slide 7: Hoạt động 2
                <Slide key="7">
                    <SlideTitle>Hoạt động 2 (10 phút)</SlideTitle>
                    <div className="flex flex-col flex-grow pb-4">
                        <p className="text-[17px] font-bold text-slate-800 mb-1">Theo dõi đoạn video và liệt kê ra những nhiệm vụ cụ thể mà nhân viên SC đã thực hiện trong cuộc gặp chăm sóc khách hàng?</p>
                        <p className="text-[15px] text-brand-orange mb-3 italic">Thảo luận nhóm và hoàn tất bảng quy trình chăm sóc bên dưới</p>
                        <div className="table-wrap flex-grow bg-white">
                            <table className="w-full text-left border-collapse h-full">
                                <thead>
                                    <tr className="bg-brand-blue text-white">
                                        <th className="p-3 w-[30%] text-[17px] font-bold border-r border-blue-700">Bước</th>
                                        <th className="p-3 w-[70%] text-[17px] font-bold">Nhiệm vụ</th>
                                    </tr>
                                </thead>
                                <tbody className="text-[16px] text-brand-blue font-semibold">
                                    {['1. Tiếp cận', '2. Khai thác tình trạng', '3. Xử lý', '4. Kiểm tra', '5. Chào kết thúc'].map((step, idx) => (
                                        <tr key={idx} className="border-b border-slate-200 last:border-0 h-[20%]">
                                            <td className="p-3 border-r border-slate-200 bg-slate-50">{step}</td>
                                            <td className="p-3"></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </Slide>,

                // Slide 8: Quy trình 5 bước CSKH
                <Slide key="8">
                    <SlideTitle>Quy trình 5 bước CSKH chủ động T15</SlideTitle>
                    <div className="flex-grow flex flex-col pb-2">
                        <div className="table-wrap flex-grow bg-white">
                            <table className="w-full text-left border-collapse h-full text-[13.5px]">
                                <thead>
                                    <tr className="bg-brand-blue text-white">
                                        <th className="p-2 w-[16%] font-bold border-r border-blue-700">BƯỚC</th>
                                        <th className="p-2 w-[42%] font-bold border-r border-blue-700">NHIỆM VỤ</th>
                                        <th className="p-2 w-[42%] font-bold">MỤC TIÊU / YÊU CẦU ĐẦU RA</th>
                                    </tr>
                                </thead>
                                <tbody className="text-slate-700">
                                    <tr className="border-b border-slate-200">
                                        <td className="p-2 font-bold text-brand-blue bg-slate-50 border-r border-slate-200">1. Tiếp cận</td>
                                        <td className="p-2 border-r border-slate-200">Chào hỏi, giới thiệu bản thân & Nêu lý do tiếp cận & Xác thực thông tin HĐ.</td>
                                        <td className="p-2 text-green-700">Khách hàng biết ai đến, thấy mục đích liên quan tới mình và đồng ý trò chuyện.</td>
                                    </tr>
                                    <tr className="border-b border-slate-200">
                                        <td className="p-2 font-bold text-brand-blue bg-slate-50 border-r border-slate-200">2. Khai thác tình trạng</td>
                                        <td className="p-2 border-r border-slate-200">Đặt câu hỏi khai thác tình trạng thực tế & sử dụng PM dựa trên dữ liệu MP và quan sát. Tiếp nhận khó khăn.</td>
                                        <td className="p-2 text-green-700">Khách hàng cởi mở chia sẻ về vận hành thực tế và các khó khăn gặp phải.</td>
                                    </tr>
                                    <tr className="border-b border-slate-200">
                                        <td className="p-2 font-bold text-brand-blue bg-slate-50 border-r border-slate-200">3. Xử lý</td>
                                        <td className="p-2 border-r border-slate-200">Xác nhận, đưa phương án xử lý vướng mắc. Hướng dẫn tính năng phù hợp và gợi mở tính năng gia tăng giá trị.</td>
                                        <td className="p-2 text-green-700">Khách hàng nắm hướng xử lý, được hướng dẫn tính năng có giá trị và quan tâm tính năng mới.</td>
                                    </tr>
                                    <tr className="border-b border-slate-200">
                                        <td className="p-2 font-bold text-brand-blue bg-slate-50 border-r border-slate-200">4. Kiểm tra</td>
                                        <td className="p-2 border-r border-slate-200">Khảo sát thêm nhu cầu hỗ trợ khác nếu có.</td>
                                        <td className="p-2 text-green-700">Khách hàng được giải quyết triệt để vướng mắc hoặc có phương án hỗ trợ rõ ràng.</td>
                                    </tr>
                                    <tr>
                                        <td className="p-2 font-bold text-brand-blue bg-slate-50 border-r border-slate-200">5. Chào kết thúc</td>
                                        <td className="p-2 border-r border-slate-200">Xác nhận hỗ trợ xong, đánh giá độ hài lòng và chào kết thúc đúng quy trình.</td>
                                        <td className="p-2 text-green-700">Khách hàng hài lòng, thoải mái và duy trì ấn tượng tốt đẹp với KiotViet.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </Slide>,

                                        <th className="p-2 w-[15%] font-bold border-r border-blue-700 text-center">Đạt [x]</th>
                                        <th className="p-2 w-[20%] font-bold text-center">Ghi chú</th>
                                    </tr>
                                </thead>
                                <tbody className="text-slate-800">
                                    {checkListItems.map((item, idx) => (
                                        <tr key={idx} className="border-b border-slate-200 hover:bg-slate-50 h-[11%]">
                                            <td className="p-2 border-r border-slate-200 font-medium">
                                                <span className="font-bold text-brand-blue mr-2">{idx + 1}.</span>{item}
                                            </td>
                                            <td className="p-2 border-r border-slate-200 text-center bg-slate-50/50"></td>
                                            <td className="p-2 bg-slate-50/50"></td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </Slide>,

                // Slide 26: Đúc kết 3-2-1
                <Slide key="26">
                    <SlideTitle>Tổng kết: Mô hình Đúc kết 3 - 2 - 1</SlideTitle>
                    <div className="flex flex-col gap-5 flex-grow justify-center pb-6 max-w-4xl mx-auto w-full">
                        <div className="bg-slate-50 rounded-2xl p-5 flex items-center gap-6 border-l-8 border-brand-blue shadow-sm">
                            <span className="text-[54px] font-black text-brand-blue">3</span>
                            <p className="text-[20px] font-bold text-slate-800">Điều quan trọng nhất bạn cần ghi nhớ khi CSKH chủ động là gì?</p>
                        </div>
                        <div className="bg-slate-50 rounded-2xl p-5 flex items-center gap-6 border-l-8 border-brand-orange shadow-sm">
                            <span className="text-[54px] font-black text-brand-orange">2</span>
                            <p className="text-[20px] font-bold text-slate-800">Hành vi bạn cam kết sẽ thay đổi/cải thiện ngay sau buổi học hôm nay?</p>
                        </div>
                        <div className="bg-slate-50 rounded-2xl p-5 flex items-center gap-6 border-l-8 border-green-600 shadow-sm">
                            <span className="text-[54px] font-black text-green-600">1</span>
                            <p className="text-[20px] font-bold text-slate-800">Hành động cụ thể bạn sẽ áp dụng ngay trong lượt gặp CSKH tiếp theo?</p>
                        </div>
                    </div>
                </Slide>,

                // Slide End
                <Slide key="end" isTitle={true}>
                    <div className="text-center flex flex-col justify-center items-center h-full">
                        <h2 className="text-[56px] font-black text-white leading-tight mb-4">
                            Chúc các bạn<br/>
                            <span className="text-brand-orange">chăm sóc khách hàng</span><br/>
                            thành công!
                        </h2>
                        <p className="text-xl text-blue-200 mt-4">KiotViet Learning & Development</p>
                    </div>
                </Slide>
            ];
        };

        const App = () => {
            const [currentSlide, setCurrentSlide] = React.useState(0);
            const slides = getSlides();

            const next = () => setCurrentSlide(p => Math.min(p + 1, slides.length - 1));
            const prev = () => setCurrentSlide(p => Math.max(p - 1, 0));

            return (
                <div>
                    {/* KHU VỰC IN: SẼ HIỆN RA KHI BẤM IN / XUẤT PDF */}
                    <div id="print-container" className="hidden">
                        {slides.map((s, idx) => (
                            <div key={idx} className="slide-page">
                                {s}
                            </div>
                        ))}
                    </div>

                    {/* KHU VỰC TRÌNH CHIẾU TRỰC TIẾP TRÊN TRÌNH DUYỆT */}
                    <div id="interactive-container" className="flex flex-col items-center justify-center min-h-screen py-6">
                        {slides[currentSlide]}

                        <div className="fixed bottom-6 flex items-center gap-4 bg-white/90 backdrop-blur-md px-6 py-2.5 rounded-full border border-slate-300 shadow-lg no-print z-50">
                            <button onClick={prev} disabled={currentSlide === 0} className="px-3 py-1 bg-slate-100 rounded-full font-bold hover:bg-orange-500 hover:text-white disabled:opacity-30">
                                ◀ Trước
                            </button>
                            <span className="text-slate-700 font-semibold">{currentSlide + 1} / {slides.length}</span>
                            <button onClick={next} disabled={currentSlide === slides.length - 1} className="px-3 py-1 bg-slate-100 rounded-full font-bold hover:bg-orange-500 hover:text-white disabled:opacity-30">
                                Tiếp ▶
                            </button>
                            <div className="h-5 w-[1px] bg-slate-300 mx-1"></div>
                            <button 
                                onClick={() => window.print()}
                                className="flex items-center gap-2 bg-brand-orange text-white px-4 py-1.5 rounded-full font-bold shadow hover:bg-orange-600"
                            >
                                <Icon name="printer" size={18} /> Xuất toàn bộ Slide ra PDF
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
