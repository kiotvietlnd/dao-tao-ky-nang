<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kịch bản CSKH Chủ động & Gia tăng giá trị</title>
    
    <!-- Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#1e3a8a',
                            orange: '#f97316',
                            sky: '#e0f2fe',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { font-family: 'Inter', sans-serif !important; }

        body {
            margin: 0;
            background: linear-gradient(-45deg, #e0f2fe, #bae6fd, #fed7aa, #ffedd5, #e0e7ff);
            background-size: 400% 400%;
        }

        .orb-1 {
            position: fixed; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(249,115,22,0.15) 0%, transparent 70%);
            border-radius: 50%; filter: blur(60px); z-index: 0; pointer-events: none;
        }
        .orb-2 {
            position: fixed; bottom: -20%; right: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(30,58,138,0.1) 0%, transparent 70%);
            border-radius: 50%; filter: blur(80px); z-index: 0; pointer-events: none;
        }

        /* Khung hiển thị slide chuẩn tỷ lệ 16:9 */
        .slide-content {
            width: 1280px;
            height: 720px;
            background: rgba(255, 255, 255, 0.96);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 1.5rem;
            box-shadow: 0 30px 60px -12px rgba(30, 58, 138, 0.15);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .title-slide-content {
            background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%) !important;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 60px;
        }

        .logo-container {
            position: absolute;
            top: 30px;
            right: 40px;
            z-index: 50;
        }
        .logo-img { height: 40px; width: auto; }
        .logo-invert { filter: brightness(0) invert(1) drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
        .table-wrap { overflow: hidden; border-radius: 1rem; border: 1px solid #e2e8f0; }

        /* ================== CSS CHO CHẾ ĐỘ XUẤT PDF ================== */
        @page {
            size: 1280px 720px;
            margin: 0;
        }

        @media print {
            body {
                background: white !important;
                overflow: visible !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .orb-1, .orb-2, .no-print {
                display: none !important;
            }
            .interactive-mode {
                display: none !important;
            }
            .print-container {
                display: block !important;
            }
            .slide-content {
                page-break-after: always !important;
                break-after: page !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                border: none !important;
                width: 1280px !important;
                height: 720px !important;
                margin: 0 !important;
            }
        }
    </style>
</head>
<body>
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const Icon = ({ name, size = 24, className = "" }) => {
            const spanRef = React.useRef(null);
            React.useEffect(() => {
                if (spanRef.current) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    lucide.createIcons({ root: spanRef.current, attrs: { width: size, height: size } });
                }
            }, [name, size, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
        };

        const Logo = ({ isTitle }) => (
            <div className="logo-container">
                <img 
                    src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal.svg" 
                    alt="KiotViet Logo" 
                    className={`logo-img ${isTitle ? 'logo-invert' : ''}`}
                    referrerPolicy="no-referrer"
                />
            </div>
        );

        const Slide = ({ children, className = "", isTitle = false }) => (
            <div className={`slide-content ${isTitle ? 'title-slide-content' : ''} ${className}`}>
                <Logo isTitle={isTitle} />
                {!isTitle && (
                    <>
                        <div className="absolute -top-12 -right-12 w-48 h-48 bg-orange-500/10 rounded-full blur-3xl pointer-events-none" />
                        <div className="absolute -bottom-24 -left-24 w-72 h-72 bg-blue-900/5 rounded-full blur-3xl pointer-events-none" />
                    </>
                )}
                <div className="relative z-10 flex flex-col h-full w-full">
                    {children}
                </div>
            </div>
        );

        const SlideTitle = ({ children }) => (
            <h2 className="text-3xl font-extrabold mb-6 text-brand-blue uppercase border-l-8 border-brand-orange pl-4 tracking-tight shrink-0 whitespace-nowrap">
                {children}
            </h2>
        );

        const Presentation = () => {
            const [currentSlide, setCurrentSlide] = React.useState(0);
            
            const checkListItems = [
                "Nêu lý do tiếp cận liên quan đến tình hình thực tế của khách hàng dựa trên MP (và quan sát)",
                "Xử lý được từ chối khi tiếp cận",
                "Thực hiện xác thực nhanh gọn rõ ràng đầy đủ",
                "Đặt các câu hỏi để khéo léo khai thác được tình trạng thực tế",
                "Xác nhận đúng vấn đề/ tình trạng & đưa ra hướng xử lý phù hợp",
                "Lựa chọn, gợi mở tính năng phù hợp tình trạng và đặc thù cửa hàng",
                "Làm rõ được giá trị lợi ích tính năng mang lại đối với khách hàng",
                "Khảo sát nhu cầu hỗ trợ thêm và xử lý vấn đề nếu có",
                "Xác nhận hỗ trợ xong và chào kết thúc đúng quy trình."
            ];

            const slides = [
                // Slide 0: Title
                <Slide key="0" isTitle={true}>
                    <div className="flex flex-col justify-center items-center h-full relative z-10 text-center">
                        <h1 className="font-black uppercase mb-8 drop-shadow-lg">
                            <span className="text-[48px] leading-tight text-white block mb-2 whitespace-nowrap">KỊCH BẢN CHĂM SÓC KHÁCH HÀNG CHỦ ĐỘNG</span>
                            <span className="text-[48px] leading-tight text-white block mb-4">& GIA TĂNG GIÁ TRỊ PHẦN MỀM</span>
                        </h1>
                        <p className="text-3xl text-blue-100 mb-12 font-medium">
                            Dành cho nhân viên DVKH SC
                        </p>
                        <div className="mt-8">
                            <span className="bg-gradient-to-r from-brand-orange to-orange-500 text-white px-8 py-3.5 rounded-full font-bold text-xl flex items-center gap-3 w-fit mx-auto shadow-xl shadow-orange-500/30 whitespace-nowrap">
                                <Icon name="graduation-cap" /> Learning & Development Department
                            </span>
                        </div>
                    </div>
                </Slide>,

                // Slide 1: Mục tiêu đào tạo
                <Slide key="1">
                    <SlideTitle>Mục tiêu đào tạo</SlideTitle>
                    <div className="grid grid-cols-12 gap-8 flex-grow items-center pb-8">
                        <div className="col-span-8 flex flex-col justify-center">
                            <p className="text-[22px] font-bold text-brand-blue mb-6">Khóa học giúp nhân viên SC có thể thực hiện trọn vẹn buổi chăm sóc khách hàng T15 theo quy trình, bao gồm:</p>
                            <div className="space-y-4">
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex gap-4 items-center">
                                    <Icon name="check-circle-2" className="text-brand-orange shrink-0" size={32} />
                                    <span className="text-slate-800 text-[19px] font-medium">Phân tích và sử dụng dữ liệu MP để chuẩn bị cho buổi gặp<br/>và tiếp cận hiệu quả</span>
                                </div>
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex gap-4 items-center">
                                    <Icon name="check-circle-2" className="text-brand-orange shrink-0" size={32} />
                                    <span className="text-slate-800 text-[19px] font-medium">Xác minh và nhận diện tình trạng thực tế của khách hàng</span>
                                </div>
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex gap-4 items-center">
                                    <Icon name="check-circle-2" className="text-brand-orange shrink-0" size={32} />
                                    <span className="text-slate-800 text-[19px] font-medium">Thực hiện hướng chăm sóc phù hợp để gia tăng giá trị cho khách hàng</span>
                                </div>
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 flex gap-4 items-center">
                                    <Icon name="check-circle-2" className="text-brand-orange shrink-0" size={32} />
                                    <span className="text-slate-800 text-[19px] font-medium">Thăm dò nhu cầu hỗ trợ thêm và hoàn tất chăm sóc.</span>
                                </div>
                            </div>
                        </div>
                        <div className="col-span-4 flex justify-center items-center">
                            <img 
                                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQmP9AOMR7BfF9WRb7cgusQxtyOsEkWbl8hVsohtbKDgw&s=10" 
                                alt="Training Objective" 
                                className="w-full object-cover rounded-3xl shadow-xl border-4 border-white h-[380px]"
                            />
                        </div>
                    </div>
                </Slide>,

                // Slide 2: Mục tiêu cuộc gọi
                <Slide key="2">
                    <SlideTitle>Mục tiêu cuộc gọi chăm sóc khách hàng chủ động</SlideTitle>
                    <div className="grid grid-cols-12 gap-10 flex-grow items-center pb-8">
                        <div className="col-span-12 space-y-6">
                            <div className="bg-blue-50 p-6 rounded-2xl border-l-4 border-brand-blue shadow-sm">
                                <p className="text-[22px] text-slate-800 leading-relaxed">
                                    Sau <strong className="text-brand-blue text-[26px]">15 ngày (T15)</strong> hoàn tất hợp đồng đăng ký phần mềm KiotViet, nhân viên SC thực hiện cuộc gọi/gặp chăm sóc khách hàng chủ động.
                                </p>
                            </div>
                            <div className="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                                <p className="text-[22px] text-slate-800 leading-relaxed">
                                    Khách hàng vừa mới sử dụng có thể cần hỗ trợ hướng dẫn và chăm sóc thêm để hiểu các giá trị của phần mềm, thấy việc dùng phần mềm là <strong className="text-brand-orange">cần thiết, hiệu quả và dễ dàng</strong>.
                                </p>
                            </div>
                            <div className="bg-gradient-to-br from-brand-orange to-orange-500 text-white p-6 rounded-2xl shadow-xl flex items-start gap-4">
                                <Icon name="target" size={40} className="shrink-0 mt-1" />
                                <div>
                                    <h4 className="text-[26px] font-bold mb-2">Mục tiêu cốt lõi</h4>
                                    <p className="text-[22px] font-medium leading-snug">
                                        Chăm sóc và gợi mở các giá trị để khách hàng thấy được những lợi ích từ phần mềm và duy trì sử dụng.
                                    </p>
                                </div>
                            </div>
                        </div>
                    </div>
                </Slide>,

                // Slide 3: Biểu hiện
                <Slide key="3">
                    <SlideTitle>Biểu hiện cuộc gọi/gặp CSKH chủ động tạo được giá trị</SlideTitle>
                    <div className="flex flex-col flex-grow justify-center w-full max-w-5xl mx-auto pb-8 space-y-6">
                        <div className="bg-white p-6 rounded-3xl border-l-8 border-brand-blue shadow-md flex items-center gap-6">
                            <div className="bg-blue-50 w-16 h-16 rounded-full flex items-center justify-center text-brand-blue font-black text-2xl shrink-0">1</div>
                            <p className="text-[22px] text-slate-700 font-medium leading-relaxed">
                                Khách hàng thao tác được cơ bản trên phần mềm mà không gặp lỗi hay trở ngại.
                            </p>
                        </div>
                        <div className="bg-white p-6 rounded-3xl border-l-8 border-brand-orange shadow-md flex items-center gap-6">
                            <div className="bg-orange-50 w-16 h-16 rounded-full flex items-center justify-center text-brand-orange font-black text-2xl shrink-0">2</div>
                            <p className="text-[22px] text-slate-700 font-medium leading-relaxed">
                                Khách hàng sẵn sàng áp dụng thêm những tính năng/ dịch vụ Add-on phù hợp mang lại giá trị lợi ích phù hợp với hoạt động kinh doanh thực tế.
                            </p>
                        </div>
                        <div className="bg-white p-6 rounded-3xl border-l-8 border-green-500 shadow-md flex items-center gap-6">
                            <div className="bg-green-50 w-16 h-16 rounded-full flex items-center justify-center text-green-600 font-black text-2xl shrink-0">3</div>
                            <p className="text-[22px] text-slate-700 font-medium leading-relaxed">
                                Khách hàng sẵn sàng áp dụng và duy trì sử dụng các tính năng phù hợp trong hoạt động kinh doanh thực tế.
                            </p>
                        </div>
                    </div>
                </Slide>,

                // Slide 4: Quy trình 5 bước
                <Slide key="4">
                    <SlideTitle>Quy trình 5 bước CSKH chủ động T15</SlideTitle>
                    <div className="flex-grow flex flex-col h-full overflow-hidden pb-1">
                        <div className="table-wrap flex-grow bg-white flex flex-col shadow-md">
                            <table className="w-full text-left border-collapse h-full">
                                <thead>
                                    <tr className="bg-brand-blue text-white">
                                        <th className="p-1.5 w-[14%] text-[14px] font-bold border-r border-blue-700 text-center">BƯỚC</th>
                                        <th className="p-1.5 w-[43%] text-[14px] font-bold border-r border-blue-700">NHIỆM VỤ</th>
                                        <th className="p-1.5 w-[43%] text-[14px] font-bold">MỤC TIÊU/YÊU CẦU ĐẦU RA</th>
                                    </tr>
                                </thead>
                                <tbody className="text-[13px] text-slate-800 leading-[1.3]">
                                    <tr className="border-b border-slate-200">
                                        <td className="p-1.5 font-bold text-brand-blue border-r border-slate-200 bg-slate-50">1. Tiếp cận</td>
                                        <td className="p-1.5 border-r border-slate-200">
                                            <ul className="list-disc pl-3 space-y-0.5">
                                                <li>Chào hỏi & giới thiệu bản thân</li>
                                                <li>Nêu lý do tiếp cận</li>
                                                <li>Xác thực nhanh thông tin hợp đồng</li>
                                            </ul>
                                        </td>
                                        <td className="p-1.5 text-green-700 font-medium">
                                            <ul className="list-disc pl-3 space-y-0.5">
                                                <li>Khách hàng biết ai đến tới từ đâu, mục đích là gì</li>
                                                <li>Khách hàng thấy mục đích gọi/gặp liên quan tới mình và đồng ý trò chuyện</li>
                                                <li>Khách hàng thoải mái khi xác nhận</li>
                                            </ul>
                                        </td>
                                    </tr>
                                    <tr className="border-b border-slate-200">
                                        <td className="p-1.5 font-bold text-brand-blue border-r border-slate-200 bg-slate-50">2. Khai thác tình trạng</td>
                                        <td className="p-1.5 border-r border-slate-200">
                                            <ul className="list-disc pl-3 space-y-0.5">
                                                <li>Đặt câu hỏi khai thác tình trạng thực tế và tình trạng sử dụng phần mềm dựa trên dữ liệu và quan sát thực tế (MP, ticket,... và liên quan đến lý do tiếp cận)</li>
                                                <li>Tiếp nhận vấn đề khó khăn của khách hàng nếu có</li>
                                            </ul>
                                        </td>
                                        <td className="p-1.5 text-green-700 font-medium">
                                            <ul className="list-disc pl-3 space-y-0.5">
                                                <li>Khách hàng chia sẻ về tình hình sử dụng/ tình trạng cửa hàng</li>
                                                <li>Khách hàng nói ra vấn đề khó khăn khi sử dụng nếu có</li>
                                            </ul>
                                        </td>
                                    </tr>
                                    <tr className="border-b border-slate-200">
                                        <td className="p-1.5 font-bold text-brand-blue border-r border-slate-200 bg-slate-50">3. Xử lý</td>
                                        <td className="p-1.5 border-r border-slate-200">
                                            <ul className="list-disc pl-3 space-y-0.5">
                                                <li>Xác nhận & Đưa phương án hỗ trợ/ xử lý vấn đề hoặc khó khăn của khách</li>
                                                <li>Hướng dẫn khách hàng sử dụng tính năng phù hợp</li>
                                                <li>Gợi mở thêm tính năng gia tăng phù hợp với tình trạng sử dụng thực tế và đặc thù ngành hàng</li>
                                            </ul>
                                        </td>
                                        <td className="p-1.5 text-green-700 font-medium">
                                            <ul className="list-disc pl-3 space-y-0.5">
                                                <li>Khách hàng nắm được hướng xử lý</li>
                                                <li>Khách hàng được giới thiệu hoặc hướng hướng dẫn tính năng phù hợp và có giá trị</li>
                                                <li>Khách hàng đồng ý tìm hiểu/quan tâm các tính năng được gợi mở thêm</li>
                                            </ul>
                                        </td>
                                    </tr>
                                    <tr className="border-b border-slate-200">
                                        <td className="p-1.5 font-bold text-brand-blue border-r border-slate-200 bg-slate-50">4. Kiểm tra</td>
                                        <td className="p-1.5 border-r border-slate-200">
                                            <ul className="list-disc pl-3 space-y-0.5">
                                                <li>Khảo sát thêm nhu cầu hỗ trợ nếu có</li>
                                            </ul>
                                        </td>
                                        <td className="p-1.5 text-green-700 font-medium">
                                            <ul className="list-disc pl-3 space-y-0.5">
                                                <li>Khách hàng chia sẻ thêm nhu cầu nếu có</li>
                                                <li>Khách hàng được hỗ trợ hoặc nắm phương án hỗ trợ thỏa đáng</li>
                                            </ul>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td className="p-1.5 font-bold text-brand-blue border-r border-slate-200 bg-slate-50">5. Chào kết thúc</td>
                                        <td className="p-1.5 border-r border-slate-200">
                                            <ul className="list-disc pl-3 space-y-0.5">
                                                <li>Xác nhận hỗ trợ xong</li>
                                                <li>Đánh giá mức độ hài lòng dịch vụ và khai thác thêm nếu chưa hài lòng</li>
                                                <li>Chào kết thúc</li>
                                            </ul>
                                        </td>
                                        <td className="p-1.5 text-green-700 font-medium">
                                            <ul className="list-disc pl-3 space-y-0.5">
                                                <li>Khách hàng không còn vướng mắc</li>
                                                <li>Khách hàng đánh giá mức độ hài lòng và chia sẻ thêm nếu có</li>
                                            </ul>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </Slide>,

                // Slide 5: Chuẩn bị thông tin
                <Slide key="5">
                    <SlideTitle>Chuẩn bị thông tin trước khi tiếp cận khách hàng</SlideTitle>
                    <div className="flex-grow flex flex-col h-full overflow-hidden pb-2">
                        <div className="table-wrap h-full bg-white flex flex-col shadow-sm">
                            <table className="w-full text-left border-collapse h-full">
                                <thead>
                                    <tr className="bg-brand-blue text-white shadow-sm">
                                        <th className="p-2 w-[25%] text-[15px] font-bold border-r border-blue-700">Nhóm thông tin</th>
                                        <th className="p-2 w-[55%] text-[15px] font-bold border-r border-blue-700">Ghi nhận & nhận định trước khi tiếp cận</th>
                                        <th className="p-2 w-[20%] text-[15px] font-bold">Mục đích</th>
                                    </tr>
                                </thead>

                                        </td>

                                            Hiện tại mình đang gặp tình trạng <strong>[Mô tả lỗi]</strong> cụ thể như thế nào ạ?<br/>
                                            Em xác nhận hiện tại mình đang gặp <strong>[Lỗi/tình trạng]</strong>
                                        </td>
                                        <td className="p-2.5">
                                            <strong className="text-brand-blue">Đưa phương án rõ ràng:</strong> Em sẽ <strong>[Hành động của SC]</strong> chuyển tới <strong>[Bộ phận]</strong> để ưu tiên xử lý trong <strong>[Thời gian]</strong> ạ! Để em kiểm tra <strong>[Lỗi/tình trạng]</strong> hiện tại và xử lý cho mình luôn nhé!

                                    {checkListItems.map((item, idx) => (

                                <span className="text-brand-orange">chăm sóc khách hàng</span><br/>
                                thành công!
                            </h2>
                        </div>
                    </div>
                </Slide>
            ];

            const nextSlide = React.useCallback(() => {
                setCurrentSlide(p => Math.min(p + 1, slides.length - 1));
            }, [slides.length]);

            const prevSlide = React.useCallback(() => {
                setCurrentSlide(p => Math.max(p - 1, 0));
            }, []);

            return (
                <div>
                    {/* GIAO DIỆN TRÌNH CHIẾU TƯƠNG TÁC (ẨN KHI IN/XUẤT PDF) */}
                    <div className="interactive-mode relative w-screen h-screen flex items-center justify-center overflow-hidden">
                        <div className="absolute inset-0 w-full h-full flex items-center justify-center">
                            {slides[currentSlide]}
                        </div>

                        {/* Thanh điều hướng & Nút xuất PDF */}
                        <div className="no-print fixed bottom-6 right-8 flex items-center gap-3 z-50">
                            <button 
                                onClick={() => window.print()}
                                className="bg-brand-orange text-white px-4 py-2 rounded-full font-bold text-sm flex items-center gap-2 shadow-lg hover:bg-orange-600 transition-all cursor-pointer"
                                title="Xuất toàn bộ 20 slide ra file PDF"
                            >
                                <Icon name="printer" size={16} /> Xuất PDF
                            </button>
                            <button 
                                onClick={prevSlide}
                                disabled={currentSlide === 0}

                            </div>
                            <button 
                                onClick={nextSlide}
                                disabled={currentSlide === slides.length - 1}
                                className={`w-9 h-9 flex items-center justify-center rounded-full transition-all backdrop-blur-sm border border-white/40 shadow-sm ${currentSlide === slides.length - 1 ? 'opacity-30 cursor-not-allowed bg-slate-100 text-slate-500' : 'bg-white/80 text-brand-blue hover:bg-brand-orange hover:text-white'}`}
                            >

                        </div>
                    </div>

                    {/* VÙNG CHỨA TẤT CẢ SLIDE CHO MÁY IN / XUẤT PDF (TỰ ĐỘNG KÍCH HOẠT KHI NHẤN IN) */}
                    <div className="print-container hidden">
                        {slides.map((slideElement, idx) => (
                            <React.Fragment key={idx}>
                                {slideElement}
                            </React.Fragment>
                        ))}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Presentation />);
    </script>
</body>
