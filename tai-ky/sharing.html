<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác định mức độ sẵn sàng chi trả & chốt deal bằng giá trị</title>
    
    <!-- Fonts: Inter is primary -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#1e3a8a',
                            orange: '#f97316',
                            sky: '#e0f2fe',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * { font-family: 'Inter', sans-serif !important; }

        /* 5D Animated Gradient Background */
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(-45deg, #e0f2fe, #bae6fd, #fed7aa, #ffedd5, #e0e7ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Floating Orbs for 5D Depth */
        .orb-1 {
            position: absolute; top: -10%; left: -10%; width: 50vw; height: 50vw;
            background: radial-gradient(circle, rgba(249,115,22,0.15) 0%, transparent 70%);
            border-radius: 50%; filter: blur(60px); animation: float 12s ease-in-out infinite; z-index: 0;
        }
        .orb-2 {
            position: absolute; bottom: -20%; right: -10%; width: 60vw; height: 60vw;
            background: radial-gradient(circle, rgba(30,58,138,0.1) 0%, transparent 70%);
            border-radius: 50%; filter: blur(80px); animation: float 15s ease-in-out infinite reverse; z-index: 0;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.05); }
            100% { transform: translateY(0) scale(1); }
        }

        /* Glassmorphism Slide Content */
        .slide-content {
            width: 1280px;
            height: 720px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 1.5rem;
            box-shadow: 0 30px 60px -12px rgba(30, 58, 138, 0.15), 0 0 40px rgba(255,255,255,0.5) inset;
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 40px 60px;
        }

        .title-slide-content {
            background: linear-gradient(135deg, #1e3a8a 0%, #172554 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px -12px rgba(0, 0, 0, 0.4);
            color: white;
            padding: 60px;
        }

        .logo-container {
            position: absolute;
            top: 30px;
            right: 40px;
            z-index: 50;
        }
        .logo-img { height: 40px; width: auto; transition: all 0.3s ease; }
        .logo-invert { filter: brightness(0) invert(1) drop-shadow(0 2px 4px rgba(0,0,0,0.3)); }
    </style>
</head>
<body>
    <div class="orb-1"></div>
    <div class="orb-2"></div>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        const { motion, AnimatePresence } = window.Motion;

        const Icon = ({ name, size = 24, className = "" }) => {
            const spanRef = React.useRef(null);
            React.useEffect(() => {
                if (spanRef.current) {
                    spanRef.current.innerHTML = `<i data-lucide="${name}" class="${className}"></i>`;
                    lucide.createIcons({ root: spanRef.current, attrs: { width: size, height: size } });
                }
            }, [name, size, className]);
            return <span ref={spanRef} className="inline-flex items-center justify-center shrink-0" />;
        };

        const Logo = ({ isTitle }) => (
            <div className="logo-container">
                <img 
                    src="https://logo.kiotviet.vn/KiotViet-Logo-Horizontal.svg" 
                    alt="KiotViet Logo" 
                    className={`logo-img ${isTitle ? 'logo-invert' : ''}`}
                    referrerPolicy="no-referrer"
                />
            </div>
        );

        const Slide = ({ children, className = "", isTitle = false }) => (
            <div className={`slide-content ${isTitle ? 'title-slide-content' : ''} ${className}`}>
                <Logo isTitle={isTitle} />
                {!isTitle && (
                    <>
                        <div className="absolute -top-12 -right-12 w-48 h-48 bg-orange-500/10 rounded-full blur-3xl pointer-events-none" />
                        <div className="absolute -bottom-24 -left-24 w-72 h-72 bg-blue-900/5 rounded-full blur-3xl pointer-events-none" />
                    </>
                )}
                <div className="relative z-10 flex flex-col h-full w-full">
                    {children}
                </div>
            </div>
        );

        const SlideTitle = ({ children }) => (
            <h2 className="text-3xl font-extrabold mb-6 text-brand-blue uppercase border-l-8 border-brand-orange pl-4 tracking-tight shrink-0 whitespace-nowrap">
                {children}
            </h2>
        );

        const Presentation = () => {
            const [currentSlide, setCurrentSlide] = React.useState(0);
            
            const slides = [
                // Slide 0: Tiêu đề
                <Slide key="0" isTitle={true}>
                    <div className="flex flex-col justify-center items-center h-full relative z-10 text-center">
                        <motion.h1 
                            initial={{ opacity: 0, y: -50 }}
                            animate={{ opacity: 1, y: 0 }}
                            className="font-black uppercase mb-8 drop-shadow-lg"
                        >
                            <span className="text-[40px] leading-tight block mb-4 text-white">Chia sẻ kỹ năng</span>
                            <span className="text-[54px] leading-tight text-brand-orange block mb-2 whitespace-nowrap">Xác định mức độ sẵn sàng chi trả</span>
                            <span className="text-[54px] leading-tight block text-brand-orange">& chốt deal bằng giá trị</span>
                        </motion.h1>
                        <motion.p 
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            transition={{ delay: 0.3 }}
                            className="text-[28px] text-blue-100 mb-12 font-medium"
                        >
                            Dành cho nhân viên sale Tái Ký
                        </motion.p>
                    </div>
                </Slide>,

                // Slide 1
                <Slide key="1">
                    <SlideTitle>Mục tiêu chương trình</SlideTitle>
                    <div className="grid grid-cols-12 gap-10 flex-grow items-center h-full">
                        <div className="col-span-7 pr-4 w-full flex flex-col justify-center">
                            <ul className="space-y-5 text-[21px] text-slate-800 font-medium">
                                <li className="bg-white/80 p-5 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-center">
                                    <div className="bg-brand-blue text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shrink-0">1</div>
                                    <span className="leading-snug">Đánh giá được khả năng chi trả của khách hàng dựa vào phân tích dữ liệu.</span>
                                </li>
                                <li className="bg-white/80 p-5 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-center">
                                    <div className="bg-brand-blue text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shrink-0">2</div>
                                    <span className="leading-snug">Xác thực được khả năng chi trả thực tế của khách hàng và các yếu tố quyết định khả năng tái ký.</span>
                                </li>
                                <li className="bg-white/80 p-5 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-center">
                                    <div className="bg-brand-blue text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shrink-0">3</div>
                                    <span className="leading-snug">Giải quyết được vấn đề tác động đến khả năng tái ký.</span>
                                </li>
                                <li className="bg-white/80 p-5 rounded-2xl shadow-sm border border-slate-100 flex gap-4 items-center">
                                    <div className="bg-brand-orange text-white w-10 h-10 rounded-full flex items-center justify-center font-bold text-lg shrink-0">4</div>
                                    <span className="leading-snug font-bold">Thuyết phục khách hàng tái ký nhanh bằng chứng minh giá trị phù hợp</span>
                                </li>
                            </ul>
                        </div>
                        <div className="col-span-5 rounded-3xl overflow-hidden shadow-2xl h-[400px] border-4 border-white flex justify-center items-center bg-white">
                            <img 
                                src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSeoDUPGZf1yzmC0fvhki8bYJ1NzbnnGWmfORvOS_jfDQ&s=10" 
                                alt="Target and Value" 
                                className="w-full h-full object-cover"
                            />
                        </div>
                    </div>
                </Slide>,

                // Slide 2
                <Slide key="2">
                    <SlideTitle>Agenda</SlideTitle>
                    <div className="flex flex-col flex-grow justify-center w-full gap-6">
                        <div className="bg-white/90 border border-white rounded-2xl p-8 shadow-lg flex items-center gap-8 transform transition hover:-translate-y-1">
                            <div>
                                <h3 className="text-[26px] font-bold text-brand-blue mb-2">Phần 1: Chia sẻ kinh nghiệm</h3>
                                <p className="text-[20px] text-slate-700 leading-relaxed">
                                    Lắng nghe chia sẻ kinh nghiệm Xác định khả năng chi trả và Chốt deal bằng giá trị qua câu chuyện thực tế.
                                </p>
                            </div>
                        </div>

                        <div className="bg-white/90 border border-white rounded-2xl p-8 shadow-lg flex items-center gap-8 transform transition hover:-translate-y-1">
                            <div>
                                <h3 className="text-[26px] font-bold text-brand-orange mb-2">Phần 2: Đúc kết cá nhân</h3>
                                <p className="text-[20px] text-slate-700 leading-relaxed">
                                    Chiêm nghiệm tình huống khách hàng chưa thành công trong quá khứ, chỉ ra nguyên nhân và trình bày phương án xử lý.
                                </p>
                            </div>
                        </div>

                        <div className="bg-white/90 border border-white rounded-2xl p-8 shadow-lg flex items-center gap-8 transform transition hover:-translate-y-1">
                            <div>
                                <h3 className="text-[26px] font-bold text-green-700 mb-2">Phần 3: Cam kết hành động</h3>
                                <p className="text-[20px] text-slate-700 leading-relaxed">
                                    Thiết lập mục tiêu cải thiện & cam kết hành động sau chương trình.
                                </p>
                            </div>
                        </div>
                    </div>
                </Slide>,

                // Slide 3
                <Slide key="3">
                    <div className="flex-grow flex flex-col justify-center items-center h-full w-full">
                        <div className="bg-gradient-to-br from-brand-blue to-blue-900 p-12 rounded-[2.5rem] shadow-2xl text-center w-full max-w-5xl border border-blue-400/20 transform transition hover:scale-105">
                            <h2 className="text-[52px] font-black text-white leading-tight uppercase drop-shadow-lg">
                                TẠI SAO PHẢI NHẬN ĐỊNH<br/>
                                <span className="text-brand-orange">TÌNH TRẠNG CỦA KHÁCH HÀNG?</span>
                            </h2>
                        </div>
                    </div>
                </Slide>,

                // Slide 4
                <Slide key="4">
                    <SlideTitle>Mục đích nhận định tình trạng của khách hàng</SlideTitle>
                    <div className="flex flex-col flex-grow h-full justify-between pb-2">
                        <div className="grid grid-cols-2 gap-8 mb-6 h-full mt-4">
                            <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-xl flex flex-col">
                                <h3 className="text-[24px] font-bold text-brand-blue mb-4 pb-3 border-b-2 border-slate-100 flex items-center gap-3">
                                    <Icon name="target" className="text-brand-orange shrink-0" size={28} />
                                    Xác định “Khách hàng cần gì để quyết định xuống tiền tái ký?”
                                </h3>
                                <ul className="space-y-4 text-[20px] text-slate-700 flex-grow flex flex-col justify-center pl-2">
                                    <li className="flex gap-3"><span className="text-brand-orange font-bold">•</span> Tính năng phù hợp giúp kinh doanh tốt hơn</li>
                                    <li className="flex gap-3"><span className="text-brand-orange font-bold">•</span> Phần mềm ổn định để an tâm sử dụng</li>
                                    <li className="flex gap-3"><span className="text-brand-orange font-bold">•</span> Giá trị của phần mềm lớn hơn chi phí bỏ ra</li>
                                </ul>
                            </div>
                            
                            <div className="bg-white p-8 rounded-3xl border border-slate-100 shadow-xl flex flex-col">
                                <h3 className="text-[24px] font-bold text-brand-blue mb-4 pb-3 border-b-2 border-slate-100 flex items-center gap-3">
                                    <Icon name="compass" className="text-brand-blue shrink-0" size={28} />
                                    Xác định mức độ sẵn sàng chi trả & đưa hướng tác động
                                </h3>
                                <ul className="space-y-4 text-[20px] text-slate-700 flex-grow flex flex-col justify-center pl-2">
                                    <li className="flex gap-3 items-start">
                                        <span className="text-green-600 font-bold mt-1 shrink-0">→</span> 
                                        <span>Trường hợp khách sẵn sàng chi trả cần <strong className="text-green-700">chốt deal nhanh</strong></span>
                                    </li>
                                    <li className="flex gap-3 items-start">
                                        <span className="text-brand-orange font-bold mt-1 shrink-0">→</span> 
                                        <span>Trường hợp khách không sẵn sàng chi trả cần <strong className="text-brand-orange">khai thác kĩ nguyên nhân</strong></span>
                                    </li>
                                </ul>
                            </div>
                        </div>

                        <div className="bg-gradient-to-r from-orange-100 to-orange-50 border-l-8 border-brand-orange p-6 rounded-2xl shadow-md shrink-0">
                            <p className="text-[22px] font-bold text-slate-800 leading-relaxed text-justify italic">
                                !!! Ngân sách không phải rào cản. Khách hàng luôn có khả năng chi&nbsp;trả, rào cản thực sự nằm ở mức độ sẵn&nbsp;sàng và niềm tin vào giá trị nhận lại có tương xứng với chi phí hay&nbsp;không.
                            </p>
                        </div>
                    </div>
                </Slide>,

                // Slide 5
                <Slide key="5">
                    <div className="flex-grow flex flex-col justify-center items-center h-full w-full">
                        <div className="bg-white/90 p-12 rounded-[2.5rem] shadow-2xl text-center w-full max-w-5xl border border-white transform transition hover:scale-105">
                            <h2 className="text-[44px] font-black text-brand-blue leading-tight drop-shadow-sm">
                                Cần nắm bắt những dữ liệu gì<br/>
                                để nhận định được<br/>
                                <span className="text-brand-orange text-[52px]">tình trạng khách hàng?</span>
                            </h2>
                        </div>
                    </div>
                </Slide>,

                // Slide 6
                <Slide key="6">
                    <SlideTitle>Dữ liệu cần phân tích</SlideTitle>
                    <div className="flex-grow flex flex-col h-full overflow-hidden pb-4">
                        <div className="h-full rounded-xl shadow-xl border border-slate-200 bg-white overflow-hidden flex flex-col">
                            <table className="w-full text-left border-collapse h-full table-fixed flex-grow flex flex-col">
                                <thead className="block w-full">
                                    <tr className="bg-brand-blue text-white flex w-full">
                                        <th className="p-3 w-[22%] text-[16px] font-bold border-r border-blue-700">Nhóm dữ liệu</th>
                                        <th className="p-3 w-[45%] text-[16px] font-bold border-r border-blue-700">Phương pháp phân tích & gợi ý tiếp cận</th>
                                        <th className="p-3 w-[33%] text-[16px] font-bold">Ý nghĩa</th>
                                    </tr>
                                </thead>
                                <tbody className="text-[14px] text-slate-800 flex flex-col flex-grow w-full">
                                    <tr className="border-b border-slate-200 flex flex-grow w-full items-stretch">
                                        <td className="p-3 font-bold text-brand-blue border-r border-slate-200 bg-slate-50 w-[22%]">1. CÁC CHỈ SỐ ĐÁNH GIÁ TỔNG QUAN</td>
                                        <td className="p-3 border-r border-slate-200 w-[45%] leading-snug">
                                            - Rà soát hệ thống xếp hạng khách hàng (phân loại A, B, C, D) và thang điểm chất lượng (0-100) trên CRM.<br/>
                                            <span className="italic text-slate-600 block mt-1">VD: Nhận diện Khách hàng nhóm A: Tần suất sử dụng thường xuyên; Tích cực khai thác dịch vụ gia tăng (Kship, K-Finance); Quá trình vận hành ổn định, ít khiếu nại, phàn nàn. Tổng giá trị giao dịch (GMV) có thể thấp nhưng lịch sử tái ký đều đặn.</span>
                                        </td>
                                        <td className="p-3 w-[33%] leading-snug">
                                            - Phản ánh mức độ gắn kết của khách hàng.<br/>
                                            - Các chỉ số tổng quan ở mức tích cực (như nhóm A) cho thấy cơ hội tái ký hợp đồng rất cao.
                                        </td>
                                    </tr>
                                    <tr className="border-b border-slate-200 flex flex-grow w-full items-stretch">
                                        <td className="p-3 font-bold text-brand-blue border-r border-slate-200 bg-slate-50 w-[22%]">2. TÌNH HÌNH KINH DOANH VÀ TIỀM NĂNG MỞ RỘNG</td>
                                        <td className="p-3 border-r border-slate-200 w-[45%] leading-snug">
                                            <strong className="text-slate-900">- Chỉ số GMV:</strong> Xu hướng tăng hoặc đi ngang thể hiện sự ổn định. Nếu giảm, cần đối chiếu thêm vì có thể do khách không nhập liệu.<br/>
                                            <strong className="text-slate-900">- Dữ liệu BI:</strong> Phân tích các kênh bán hiện tại. Có thể sở hữu nguồn doanh thu chưa ghi nhận trên hệ thống.<br/>
                                            <strong className="text-slate-900">- Khảo sát thực tế:</strong> Kiểm tra độ sôi động trên Shopee, Fanpage để xác thực tình hình kinh doanh.
                                        </td>
                                        <td className="p-3 w-[33%] leading-snug">
                                            - Khi các tín hiệu phản ánh tình hình kinh doanh tích cực và ổn định, có thể khẳng định khách hàng đang làm ăn có lãi. Mức độ sẵn sàng chi trả cho phần mềm của họ sẽ rất cao.
                                        </td>
                                    </tr>
                                    <tr className="border-b border-slate-200 flex flex-grow w-full items-stretch">
                                        <td className="p-3 font-bold text-brand-blue border-r border-slate-200 bg-slate-50 w-[22%]">3. TRẢI NGHIỆM VÀ THỰC TRẠNG SỬ DỤNG PHẦN MỀM</td>
                                        <td className="p-3 border-r border-slate-200 w-[45%] leading-snug">
                                            <strong className="text-slate-900">- Lịch sử hỗ trợ:</strong> Rà soát tần suất gặp lỗi, số lượng ticket, mức độ nghiêm trọng và tiến độ xử lý triệt để.<br/>
                                            <strong className="text-slate-900">- Mức độ sử dụng tính năng:</strong> Đánh giá các tính năng được dùng nhiều nhất/ít nhất. Xác định tính năng cốt lõi khách chưa tận dụng.
                                        </td>
                                        <td className="p-3 w-[33%] leading-snug">
                                            - Rủi ro rời bỏ cao nếu: Khách gặp lỗi thường xuyên chưa được xử lý dứt điểm. Hoặc khách chỉ dùng các tính năng cơ bản, không thấy giá trị tương xứng.<br/>
                                            <span className="italic text-slate-600 block mt-1">VD: Bán tạp hóa nhưng không dùng quản lý Lô/Date, chỉ in bill => Nguy cơ không tái ký cao.</span>
                                        </td>
                                    </tr>
                                    <tr className="flex flex-grow w-full items-stretch">
                                        <td className="p-3 font-bold text-brand-blue border-r border-slate-200 bg-slate-50 w-[22%]">4. MỨC ĐỘ PHỤ THUỘC VÀO HỆ SINH THÁI KIOTVIET</td>
                                        <td className="p-3 border-r border-slate-200 w-[45%] leading-snug">
                                            - Đo lường mức độ sử dụng các dịch vụ gia tăng và tính năng mở rộng (Kship, K-Finance).<br/>
                                            - Kiểm tra trạng thái kích hoạt và sử dụng tính năng Hóa đơn điện tử (HĐĐT).
                                        </td>
                                        <td className="p-3 w-[33%] leading-snug">
                                            - Sử dụng nhiều dịch vụ gia tăng đồng nghĩa với mức độ phụ thuộc lớn, giúp giảm thiểu tối đa tỷ lệ rời bỏ.<br/>
                                            - Khách hàng sử dụng HĐĐT có nhu cầu lưu trữ dữ liệu lâu dài và bắt buộc, do đó tỷ lệ tái ký sẽ cao hơn.
                                        </td>

                            onClick={prevSlide}
                            disabled={currentSlide === 0}
                            className={`w-8 h-8 flex items-center justify-center rounded-full transition-all backdrop-blur-sm border border-white/40 shadow-sm ${currentSlide === 0 ? 'opacity-30 cursor-not-allowed bg-slate-100 text-slate-500' : 'bg-white/60 text-brand-blue hover:bg-brand-orange hover:text-white hover:border-brand-orange'}`}
                        >
                            <span className="inline-flex items-center justify-center shrink-0"><i data-lucide="chevron-left" width="18" height="18"></i></span>
                        </button>
                        <div className="text-sm font-semibold text-slate-600 bg-white/50 backdrop-blur-sm px-3 py-1.5 rounded-full border border-white/40 shadow-sm min-w-[60px] text-center">
                            {currentSlide + 1} / {slides.length}
                        </div>
                        <button 
                            onClick={nextSlide}
                            disabled={currentSlide === slides.length - 1}
                            className={`w-8 h-8 flex items-center justify-center rounded-full transition-all backdrop-blur-sm border border-white/40 shadow-sm ${currentSlide === slides.length - 1 ? 'opacity-30 cursor-not-allowed bg-slate-100 text-slate-500' : 'bg-white/60 text-brand-blue hover:bg-brand-orange hover:text-white hover:border-brand-orange'}`}
                        >
                            <span className="inline-flex items-center justify-center shrink-0"><i data-lucide="chevron-right" width="18" height="18"></i></span>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Presentation />);
        
        // Initialize lucide icons for the static navigation buttons
        lucide.createIcons();
    </script>
</body>
</html>
